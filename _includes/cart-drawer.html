<div
  id="cart-overlay"
  class="cart-overlay"
  hidden
></div>

<div
  id="cart-drawer"
  class="cart-drawer"
  aria-hidden="true"
>
  <aside
    class="cart-drawer__panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cart-title"
  >

    <div class="cart-drawer__header">
      <h2 id="cart-title">
        Your Cart
      </h2>

      <button
        id="cart-drawer-close"
        class="cart-drawer__close"
        type="button"
        aria-label="Close cart"
      >
        ×
      </button>
    </div>


    <div
      id="cart-items"
      class="cart-drawer__items"
    ></div>


    <div
      id="cart-empty"
      class="cart-drawer__empty"
    >
      Your cart is empty.
    </div>


    <div
      id="cart-footer"
      class="cart-drawer__footer"
    >

      <div class="cart-drawer__subtotal">
        <span>
          Subtotal
        </span>

        <strong
          id="cart-subtotal"
        >
          $0.00
        </strong>
      </div>

		<a
		  href="{{ '/checkout/' | relative_url }}"
		  id="checkout-button"
		  class="button cart-drawer__checkout-button"
		>
		  Checkout
		</a>

		<a
		  href="{{ '/shop/' | relative_url }}"
		  class="cart-drawer__continue"
		>
		  Continue Shopping
		</a>


      <p
        id="checkout-error"
        class="checkout-error"
        hidden
      ></p>

    </div>

  </aside>
</div>
