brand:
  name: "Pinnacle Home Goods"
  tagline: "Home goods with personality."
  logo: "/assets/images/logo.png"

theme:
  primary: "#111D27"
  secondary: "#5F6870"
  accent: "#B88732"
  background: "#FFFFFF"

store:
  currency: "USD"
  currency_symbol: "$"

announcement:
  enabled: true
  text: "Free shipping on orders over $50"

contact:
  email: "info@mthpinnaclellc.com"

social:
  instagram: ""
  facebook: ""
  tiktok: ""

commerce:
  provider: "global-payments"
  checkout_endpoint: "https://jekyll-commerce-api-sandbox.mth-commerce.workers.dev/api/checkout"
  order_status_endpoint: "https://jekyll-commerce-api-sandbox.mth-commerce.workers.dev/api/order-status"
  max_quantity: 10

policies:
  - handle: "shipping"
    title: "Shipping"
    enabled: true

  - handle: "returns"
    title: "Returns & Refunds"
    enabled: true

  - handle: "privacy"
    title: "Privacy Policy"
    enabled: true

  - handle: "terms"
    title: "Terms of Service"
    enabled: true

collections:
  - handle: honey-do
    title: "Honey Do Collections"
    description: "For the projects, the punch lists, and the people who somehow became the household expert."
    image: "/assets/images/collections/honey-do.png"
  
  - handle: shirts
    title: "Shirts"
    description: "Everyday tees and apparel."
    image: "/assets/images/collections/shirts.png"

  - handle: best-sellers
    title: "Best Sellers"
    description: "Customer favorites from across the collection."
    image: "/assets/images/collections/best-sellers.png"

homepage:
  hero:
    eyebrow: "INTRODUCING HONEY DO"
    heading: "Same House. Different Mission."
    text: "Everyday gear for the projects, personalities, and laughs that come with getting it done."
    button_label: "Shop Honey Do"
    button_url: "/shop/"
    image: "/assets/images/home/hero.png"

  featured:
    eyebrow: "HONEY DO COLLECTIONS"
    heading: "Featured Products"
    text: "Gear for getting it done—or at least looking like you know what you're doing."

  promo:
    eyebrow: "PINNACLE HOME GOODS"
    heading: "Home goods with personality."
    text: "Useful, wearable, giftable, and made for everyday life."
    button_label: "Shop All"
    button_url: "/shop/"
    image: "/assets/images/home/promo.png"

  benefits:
    - title: "Free Shipping"
      text: "On orders over $50"
    - title: "Secure Checkout"
      text: "Safe and protected payments"
    - title: "Made to Order"
      text: "Produced just for you"
    - title: "Customer Support"
      text: "We're here when you need us"