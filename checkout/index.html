---
layout: default
title: Checkout
---

<section class="checkout-page">
  <div class="page-width">

    <div class="checkout-page__heading">
      <p class="home-eyebrow">SECURE CHECKOUT</p>
      <h1>Checkout</h1>
    </div>

    <div class="checkout-layout">

      <div class="checkout-main">

        <section class="checkout-section">
          <h2>Contact</h2>

          <div class="checkout-field">
            <label for="checkout-email">Email</label>
            <input
              id="checkout-email"
              type="email"
              autocomplete="email"
              required
            >
          </div>
        </section>


        <section class="checkout-section">
          <h2>Shipping Address</h2>

          <div class="checkout-field">
            <label for="checkout-name">Full Name</label>
            <input
              id="checkout-name"
              type="text"
              autocomplete="name"
              required
            >
          </div>

          <div class="checkout-field">
            <label for="checkout-phone">
              Phone <span>(optional)</span>
            </label>
            <input
              id="checkout-phone"
              type="tel"
              autocomplete="tel"
            >
          </div>

          <div class="checkout-field">
            <label for="checkout-address1">Address</label>
            <input
              id="checkout-address1"
              type="text"
              autocomplete="address-line1"
              required
            >
          </div>

          <div class="checkout-field">
            <label for="checkout-address2">
              Apartment, Suite, Unit <span>(optional)</span>
            </label>
            <input
              id="checkout-address2"
              type="text"
              autocomplete="address-line2"
            >
          </div>

          <div class="checkout-field">
            <label for="checkout-city">City</label>
            <input
              id="checkout-city"
              type="text"
              autocomplete="address-level2"
              required
            >
          </div>

          <div class="checkout-field-row">

            <div class="checkout-field">
              <label for="checkout-state">State</label>

              <select
                id="checkout-state"
                autocomplete="address-level1"
                required
              >
                <option value="">Select</option>
                <option value="AL">AL</option>
                <option value="AK">AK</option>
                <option value="AZ">AZ</option>
                <option value="AR">AR</option>
                <option value="CA">CA</option>
                <option value="CO">CO</option>
                <option value="CT">CT</option>
                <option value="DE">DE</option>
                <option value="FL">FL</option>
                <option value="GA">GA</option>
                <option value="HI">HI</option>
                <option value="ID">ID</option>
                <option value="IL">IL</option>
                <option value="IN">IN</option>
                <option value="IA">IA</option>
                <option value="KS">KS</option>
                <option value="KY">KY</option>
                <option value="LA">LA</option>
                <option value="ME">ME</option>
                <option value="MD">MD</option>
                <option value="MA">MA</option>
                <option value="MI">MI</option>
                <option value="MN">MN</option>
                <option value="MS">MS</option>
                <option value="MO">MO</option>
                <option value="MT">MT</option>
                <option value="NE">NE</option>
                <option value="NV">NV</option>
                <option value="NH">NH</option>
                <option value="NJ">NJ</option>
                <option value="NM">NM</option>
                <option value="NY">NY</option>
                <option value="NC">NC</option>
                <option value="ND">ND</option>
                <option value="OH">OH</option>
                <option value="OK">OK</option>
                <option value="OR">OR</option>
                <option value="PA">PA</option>
                <option value="RI">RI</option>
                <option value="SC">SC</option>
                <option value="SD">SD</option>
                <option value="TN">TN</option>
                <option value="TX">TX</option>
                <option value="UT">UT</option>
                <option value="VT">VT</option>
                <option value="VA">VA</option>
                <option value="WA">WA</option>
                <option value="WV">WV</option>
                <option value="WI">WI</option>
                <option value="WY">WY</option>
                <option value="DC">DC</option>
              </select>
            </div>

            <div class="checkout-field">
              <label for="checkout-postal-code">ZIP Code</label>
              <input
                id="checkout-postal-code"
                type="text"
                inputmode="numeric"
                autocomplete="postal-code"
                maxlength="10"
                required
              >
            </div>

          </div>

          <div class="checkout-field">
            <label for="checkout-country">Country</label>

            <select
              id="checkout-country"
              autocomplete="country"
              required
            >
              <option value="US" selected>
                United States
              </option>
            </select>
          </div>

        </section>

        <p
          id="checkout-error"
          class="checkout-error"
          hidden
        ></p>

        <button
          id="checkout-submit"
          class="button checkout-page__submit"
          type="button"
        >
          Continue to Payment
        </button>

        <p class="checkout-page__secure">
          Secure payment processing
        </p>

      </div>


      <aside class="checkout-summary">
        <h2>Order Summary</h2>

        <div id="checkout-summary-items"></div>

        <div class="checkout-summary__totals">
          <div>
            <span>Subtotal</span>
            <strong id="checkout-summary-subtotal">$0.00</strong>
          </div>

          <p>
            Shipping and taxes are calculated during checkout.
          </p>
        </div>
      </aside>

    </div>
  </div>
</section>
