---
layout: default
---

<section class="policy-page">

  <div class="page-width">

    <article class="policy-page__content">

      <header class="policy-page__header">

        <p class="policy-page__eyebrow">
          Store Policy
        </p>

        <h1>{{ page.title }}</h1>

        {% if page.last_updated %}
          <p class="policy-page__updated">
            Last updated: {{ page.last_updated }}
          </p>
        {% endif %}

      </header>

      <div class="policy-page__body">
        {{ content }}
      </div>

    </article>

  </div>

</section>
