# =========================================================
# STORE SEO
# Update these values when cloning the storefront.
# =========================================================

title: "Pinnacle Home Goods"
description: "Practical home goods, apparel, and everyday essentials with personality."

url: "https://pinnacle-home-goods.mthpinnacle.store"
baseurl: ""

logo: "/assets/images/logo.png"

markdown: kramdown
permalink: pretty

collections:
  products:
    output: true
    permalink: /products/:name/

defaults:
  - scope:
      path: ""
      type: products
    values:
      layout: product
      seo:
        type: Product

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor